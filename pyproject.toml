[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "quantlab"
version = "0.1.0"
description = "Quantitative finance foundations, production US equity portfolio & risk system, and agentic research platform."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Arthur7Li" }
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
market = [
    "exchange-calendars>=4.5.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.50",
    "curl-cffi>=0.7.0",
    "alpaca-py>=0.33.0",
]
research = [
    "statsmodels>=0.14.0",
    "scikit-learn>=1.5.0",
    "cvxpy>=1.5.0",
    "arch>=7.0.0",
    "lightgbm>=4.5.0",
]
notebooks = [
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["quantlab", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["src/quantlab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
